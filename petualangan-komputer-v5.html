<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Si Komputer</title>
<style>
:root{--bg1:#7dd3fc;--bg2:#fef3c7;--card:#fff;--tx:#1f2d3d;--pri:#3b82f6;--ok:#22c55e;--bad:#ef4444;--sel:#fde68a;--mut:#64748b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e1b4b;--bg2:#0f172a;--card:#1e293b;--tx:#f1f5f9;--sel:#854d0e;--mut:#94a3b8}}
:root[data-theme="dark"]{--bg1:#1e1b4b;--bg2:#0f172a;--card:#1e293b;--tx:#f1f5f9;--sel:#854d0e;--mut:#94a3b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(var(--bg1),var(--bg2)) fixed;color:var(--tx);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:46px 14px 20px}
#mu{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.12);margin-bottom:12px;animation:pop .35s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-size:27px;margin:6px 0;text-align:center}h2{font-size:19px;margin:0 0 8px}
.big{font-size:60px;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.center{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-size:18px;font-weight:bold;padding:14px;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.top{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px;padding-right:44px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it,.fn,.opt,.lc{border:3px solid transparent;background:var(--card);color:var(--tx);font:inherit;border-radius:14px;padding:8px 4px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);text-align:center}
.it,.lc{font-size:13px;font-weight:bold}
.dv{width:100%;height:80px;object-fit:contain;background:#fff;border-radius:10px;display:block}
.hero{width:100%;border-radius:14px;display:block;animation:pop .5s}
.lc .dv{animation:fl 3s ease-in-out infinite}.lc:nth-child(2n) .dv{animation-delay:.6s}.lc:nth-child(3n) .dv{animation-delay:1.2s}
@keyframes fl{50%{transform:translateY(-5px) rotate(-2deg)}}
.fn{font-size:14px;display:flex;align-items:center;justify-content:center;min-height:62px;padding:8px}
.opt{display:block;width:100%;text-align:left;font-size:17px;margin-top:10px;padding:12px}
.sel{background:var(--sel);border-color:#f59e0b;transform:scale(1.05)}
.done{background:var(--ok);color:#fff;border-color:var(--ok);cursor:default;animation:pop .4s}
.shake{animation:sh .4s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bub{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px;margin:10px 0;min-height:56px;font-weight:bold;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bub b.r{font-size:34px;animation:bob 1.5s infinite}
.fb{padding:12px;border-radius:12px;margin-top:12px;font-size:16px;animation:pop .3s}
.fb.good{background:rgba(34,197,94,.18)}.fb.wrong{background:rgba(239,68,68,.18)}
.bar{height:10px;background:rgba(100,116,139,.3);border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:20;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#bg{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
#bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.45) 2px,transparent 2px);background-size:28px 28px}
.fl{position:absolute;bottom:-70px;opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(360deg)}}
.cloud{position:absolute;opacity:.75;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(115vw)}}
#mm{position:fixed;right:54px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.top{padding-right:92px!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f4f6"/><stop offset="1" stop-color="#9ca3af"/></linearGradient>
<linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
</defs></svg>
<div id="bg"></div>
<button id="mu" aria-label="Suara">🔊</button>
<button id="mm" aria-label="Musik">🎵</button>
<div id="app"></div>

function mnote(f,t,d,v,ty){var o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function sched(){while(nextT<AC.currentTime+.6){var ch=CH[Math.floor(mStep/8)%4],i=mStep%8;
if(i===0){ch.forEach(function(f){mnote(f,nextT,2.3,.03,"sine")});mnote(ch[0]/2,nextT,.9,.07,"triangle")}
if(i===4)mnote(ch[0]/2,nextT,.6,.05,"triangle");
mnote(ch[PAT[i]]*2,nextT,.28,.035,"triangle");nextT+=.3;mStep++}}
function startMusic(){if(!musicOn||mTimer)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();nextT=AC.currentTime+.1;sched();mTimer=setInterval(sched,200)}catch(e){}}

function intro(){
app.innerHTML='<div class="card center"><h2>💻 Ini namanya Komputer!</h2><img class="hero" src="'+IMG.set+'" alt="Satu set komputer"></div><div class="bub"><b class="r">🤖</b><span>Komputer adalah mesin pintar yang membantu manusia mengerjakan banyak hal dengan cepat. Tapi komputer tidak bisa berpikir sendiri, ia hanya mengikuti perintah dari kita.</span></div><div class="card"><h2>Komputer bisa dipakai untuk apa?</h2><div class="g3" id="us"></div></div><div class="bub" id="ub"><b class="r">🤖</b><span>Ketuk gambar di atas untuk tahu kegunaannya!</span></div><button class="btn" id="nx">Kenali bagian-bagiannya ➡️</button>';
var U=[["📚","Belajar","Mencari bahan pelajaran dan belajar lewat video."],["📝","Tugas","Menulis dan merapikan tugas sekolah."],["🎨","Menggambar","Membuat gambar dan karya yang indah."],["🎮","Main game","Bermain game seru, seperti game ini!"],["🎬","Video dan musik","Menonton video dan mendengarkan musik."],["💌","Berkirim kabar","Mengirim pesan atau video call ke keluarga dan teman."]];
var us=document.getElementById("us");
U.forEach(function(u){var c=document.createElement("button");c.className="lc";c.innerHTML='<div style="font-size:34px">'+u[0]+'</div>'+u[1];c.onclick=function(){sfx.tap();document.getElementById("ub").innerHTML='<b class="r">🤖</b><span><u>'+u[1]+'</u>: '+u[2]+'</span>'};us.appendChild(c)});
document.getElementById("nx").onclick=function(){sfx.ok();learn()};
}

function learn(){
app.innerHTML='<div class="card"><h2>👀 Kenalan Dulu</h2>Ketuk setiap perangkat untuk mengenalnya.</div><div class="g3" id="lg"></div><div class="bub" id="b"><b class="r">🤖</b><span>Ketuk salah satu perangkat ya!</span></div><button class="btn" id="rd">Aku siap main! 🎮</button>';
var lg=document.getElementById("lg"),b=document.getElementById("b");
PARTS.forEach(function(p){var c=document.createElement("button");c.className="lc";c.innerHTML=svg(p.k)+p.n;c.onclick=function(){sfx.tap();b.innerHTML='<b class="r">🤖</b><span><u>'+p.n+'</u>: '+p.d+'</span>'};lg.appendChild(c)});
document.getElementById("rd").onclick=function(){sfx.ok();level1()};
}

function level1(){
var sel=null,matched=0;
app.innerHTML='<div class="top"><span>Level 1: Pasangkan</span><span id="sc">⭐ '+S.score+'</span></div><div class="card" style="margin-bottom:8px"><b>Ketuk alat, lalu ketuk fungsinya.</b></div><div class="g3" id="its"></div><div class="bub" id="m"><b class="r">🤖</b><span>Ayo mulai, kamu pasti bisa!</span></div><div class="g2" id="fns"></div>';
var its=document.getElementById("its"),fe=document.getElementById("fns"),m=document.getElementById("m");
function say(t){m.innerHTML='<b class="r">🤖</b><span>'+t+'</span>'}
PARTS.forEach(function(p){var b=document.createElement("button");b.className="it";b.innerHTML=svg(p.k)+p.n;b.onclick=function(){if(b.classList.contains("done"))return;sfx.tap();[].forEach.call(its.children,function(x){x.classList.remove("sel")});b.classList.add("sel");sel={p:p,b:b};say("Kamu memilih "+p.n+". Sekarang pilih fungsinya!")};its.appendChild(b)});
shuffle(PARTS).forEach(function(p){var b=document.createElement("button");b.className="fn";b.textContent=p.f;b.onclick=function(){
if(b.classList.contains("done"))return;
if(!sel){sfx.bad();say("Pilih alatnya dulu ya 👆");return}
if(sel.p===p){sfx.ok();burst(8);b.classList.add("done");sel.b.classList.remove("sel");sel.b.classList.add("done");sel.b.style.color="#fff";sel=null;S.score++;matched++;document.getElementById("sc").textContent="⭐ "+S.score;say("Benar! "+p.d);
if(matched===PARTS.length)setTimeout(intro2,1800)}
else{sfx.bad();say("Belum tepat, coba lagi ya 💪");b.classList.add("shake");setTimeout(function(){b.classList.remove("shake")},450)}
};fe.appendChild(b)});
}

function intro2(){
sfx.win();burst(18);
app.innerHTML='<div class="card center"><div class="big">🎉</div><h2>Level 1 selesai!</h2><p>Kamu sudah mengenal perangkat komputer. Sekarang belajar aman di internet bersama Robi.</p><button class="btn" id="n">Lanjut ke Level 2 🌐</button></div>';
document.getElementById("n").onclick=function(){sfx.ok();level2(0)};
}

function level2(i){
if(i>=QS.length)return end();
var q=QS[i];
app.innerHTML='<div class="top"><span>Level 2: Internet Aman</span><span id="sc">⭐ '+S.score+'</span></div><div class="bar"><i style="width:'+(i/QS.length*100)+'%"></i></div><div class="card"><div class="big" style="font-size:52px">'+q.e+'</div><div class="center" style="color:var(--mut)">Soal '+(i+1)+' dari '+QS.length+'</div><h2>'+q.q+'</h2><div id="os"></div><div id="fb"></div></div>';
var os=document.getElementById("os"),fb=document.getElementById("fb"),done=false;
q.o.forEach(function(t,k){var b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=function(){
if(done)return;done=true;var ok=k===q.a;
if(ok){S.score++;b.classList.add("done");sfx.ok();burst(8)}else{b.classList.add("shake");os.children[q.a].classList.add("done");sfx.bad()}
document.getElementById("sc").textContent="⭐ "+S.score;
fb.innerHTML='<div class="fb '+(ok?"good":"wrong")+'"><b>🤖 '+(ok?"Benar! Hebat!":"Belum tepat, tidak apa-apa!")+'</b><br>'+q.w+'</div><button class="btn" id="nx">'+(i+1<QS.length?"Soal berikutnya ➡️":"Lihat hasil 🏆")+'</button>';
document.getElementById("nx").onclick=function(){sfx.tap();level2(i+1)};
};os.appendChild(b)});
}

function end(){
var max=PARTS.length+QS.length,p=S.score/max,st=p>=0.9?3:p>=0.6?2:1;
var t=st===3?"Luar biasa! Kamu jagoan komputer!":st===2?"Bagus! Sedikit lagi sempurna!":"Ayo coba lagi, kamu pasti bisa!";
sfx.win();burst(24);
app.innerHTML='<div class="card center"><div class="big">'+"⭐".repeat(st)+'</div><h1>'+t+'</h1><p>Skor kamu: <b>'+S.score+' dari '+max+'</b></p><button class="btn" id="a">🔄 Main Lagi</button></div>';
document.getElementById("a").onclick=home;
}
// ===== Latar belakang ramai =====
(function(){var bg=document.getElementById("bg"),ic=["💻","🖱️","⌨️","🖨️","💾","🚀","⭐","🔊","📱","🎮"];
for(var i=0;i<16;i++){var s=document.createElement("span");s.className="fl";s.textContent=ic[i%ic.length];s.style.left=(i*6.4+Math.random()*4)+"%";s.style.fontSize=(22+Math.random()*30)+"px";s.style.animationDuration=(14+Math.random()*16)+"s";s.style.animationDelay=(-Math.random()*25)+"s";bg.appendChild(s)}
for(var j=0;j<3;j++){var c=document.createElement("span");c.className="cloud";c.textContent="☁️";c.style.top=(6+j*16)+"%";c.style.fontSize=(60+j*18)+"px";c.style.animationDuration=(45+j*20)+"s";c.style.animationDelay=(-j*18)+"s";bg.appendChild(c)}})();
home();
</script>
</body>
</html>
